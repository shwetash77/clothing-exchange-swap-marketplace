version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swapmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: swapmarket
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-please-32-bytes-minimum
      RAZORPAY_KEY_ID: rzp_test_Tf08Fig0xeOkER
      RAZORPAY_KEY_SECRET: 0g1DbylAvQ7HpJuH9vprMdOb 
      RAZORPAY_WEBHOOK_SECRET: replace_me
    ports:
      - "8080:8080"

volumes:
  pgdata: