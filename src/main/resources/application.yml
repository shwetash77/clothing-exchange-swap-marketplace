server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swapmarket}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # use flyway/liquibase for real production use
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-please-32-bytes-min}
    expiration-ms: 86400000  # 24h

